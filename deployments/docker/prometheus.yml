# Scrape configuration for the local stack. Targets are static; service
# discovery arrives with F11.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pulseflow-api
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: pulseflow-api

  - job_name: pulseflow-worker
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: pulseflow-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
